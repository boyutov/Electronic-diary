<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="/js/safe-html.js"></script>
    <script src="/js/i18n-ky.js"></script>
    <script src="/js/i18n.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля — Electronic Diary</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body class="auth-page">

<main class="auth-card">
    <a class="auth-brand" href="/"><span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20"/></svg></span>Electronic Diary</a>
    <h2>Забыли пароль?</h2>
    <p class="subtitle">Укажите школу и логин — пришлём ссылку для смены пароля на привязанную почту (у младших учеников — на почту родителя).</p>

    <div class="error-msg" id="error-msg"></div>
    <div class="alert-success" id="done-msg" style="display:none;"></div>

    <form id="forgot-form">
        <div class="form-group">
            <label for="schoolName">Название школы</label>
            <input id="schoolName" required autocomplete="organization">
        </div>
        <div class="form-group">
            <label for="email">Логин (email)</label>
            <input id="email" type="email" required autocomplete="email">
        </div>
        <button class="btn" type="submit">Отправить ссылку</button>
    </form>
    <div class="auth-footer"><a class="back-link" href="/login">← Вернуться ко входу</a></div>
</main>

<script>
document.getElementById("forgot-form").addEventListener("submit", e => {
    e.preventDefault();
    const errorMsg = document.getElementById("error-msg");
    const doneMsg = document.getElementById("done-msg");
    errorMsg.style.display = "none";
    fetch("/api/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            schoolName: document.getElementById("schoolName").value,
            email: document.getElementById("email").value
        })
    })
    .then(async r => {
        const body = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(body.message || "Не удалось отправить ссылку");
        doneMsg.textContent = "✉️ " + body.message + ". Ссылка действует 1 час.";
        doneMsg.style.display = "block";
        document.getElementById("forgot-form").style.display = "none";
    })
    .catch(err => { errorMsg.textContent = err.message; errorMsg.style.display = "block"; });
});
</script>
</body>
</html>
