<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="/js/safe-html.js"></script>
    <script src="/js/i18n-ky.js"></script>
    <script src="/js/i18n.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль — Electronic Diary</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body class="auth-page">

<main class="auth-card">
    <a class="auth-brand" href="/"><span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20"/></svg></span>Electronic Diary</a>
    <h2>Новый пароль</h2>
    <p class="subtitle">Придумайте новый пароль для входа в электронный дневник.</p>

    <div class="error-msg" id="error-msg"></div>

    <form id="reset-form">
        <div class="form-group">
            <label for="newPassword">Новый пароль</label>
            <input id="newPassword" type="password" minlength="8" required autocomplete="new-password">
            <div class="hint">Не короче 8 символов и не совпадает с логином</div>
        </div>
        <div class="form-group">
            <label for="repeatPassword">Повторите пароль</label>
            <input id="repeatPassword" type="password" minlength="8" required autocomplete="new-password">
        </div>
        <button class="btn" type="submit">Сохранить пароль</button>
    </form>
    <div class="auth-footer"><a class="back-link" href="/login">← Вернуться ко входу</a></div>
</main>

<script>
const token = new URLSearchParams(window.location.search).get("token");
document.getElementById("reset-form").addEventListener("submit", e => {
    e.preventDefault();
    const errorMsg = document.getElementById("error-msg");
    errorMsg.style.display = "none";
    const newPassword = document.getElementById("newPassword").value;
    if (newPassword !== document.getElementById("repeatPassword").value) {
        errorMsg.textContent = "Пароли не совпадают";
        errorMsg.style.display = "block";
        return;
    }
    fetch("/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, newPassword })
    })
    .then(async r => {
        if (!r.ok) throw new Error(await r.text() || "Не удалось сменить пароль");
        alert("Пароль изменён. Войдите с новым паролем.");
        window.location.href = "/login";
    })
    .catch(err => { errorMsg.textContent = err.message; errorMsg.style.display = "block"; });
});
</script>
</body>
</html>
