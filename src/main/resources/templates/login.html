<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="/js/safe-html.js"></script>
    <script src="/js/i18n-ky.js"></script>
    <script src="/js/i18n.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Electronic Diary</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body class="auth-page">

<main class="auth-card">
    <a class="auth-brand" href="/"><span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20"/></svg></span>Electronic Diary</a>
    <h2>Добро пожаловать</h2>
    <p class="subtitle">Войдите в панель вашей школы</p>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form">
        <div class="form-group">
            <label for="schoolName">Название школы</label>
            <input id="schoolName" name="schoolName" placeholder="school123" required autocomplete="organization">
        </div>
        <div class="form-group">
            <label for="username">Email</label>
            <input id="username" name="username" type="email" placeholder="admin@school.kz" required autocomplete="email">
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button class="btn" type="submit">Войти →</button>
    </form>
    <div class="auth-links"><a href="/forgot-password">Забыли пароль?</a></div>

    <div class="notice">
        Только что зарегистрировали школу? Сначала пройдите
        <a href="/activate">активацию</a>.
    </div>
    <div class="auth-footer"><a class="back-link" href="/">← Вернуться на главную</a></div>
</main>

<script src="/js/login.js"></script>
<script>
// Override default login.js error handling to show inline error
const origSubmit = document.getElementById('login-form').onsubmit;
document.getElementById('login-form').addEventListener('submit', () => {
    document.getElementById('error-msg').style.display = 'none';
});
// Patch fetch error display
const _origFetch = window.fetch;
</script>
<script>
// Patch login error to show inline
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    // login.js already handles submit, we just need to intercept alert
    window._loginError = (msg) => {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
    };
});
</script>
</body>
</html>
