<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="/js/safe-html.js"></script>
    <script src="/js/i18n-ky.js"></script>
    <script src="/js/i18n.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля — Electronic Diary</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body class="auth-page">

<main class="auth-card">
    <a class="auth-brand" href="/"><span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20"/></svg></span>Electronic Diary</a>
    <h2>Смена пароля</h2>
    <p class="subtitle" id="subtitle">Введите текущий пароль и задайте новый. Если вы вошли с временным паролем из письма, укажите его как текущий.</p>

    <div class="error-msg" id="error-msg"></div>

    <form id="password-form">
        <div class="form-group">
            <label for="currentPassword">Текущий пароль</label>
            <input id="currentPassword" type="password" required autocomplete="current-password">
        </div>
        <div class="form-group">
            <label for="newPassword">Новый пароль</label>
            <input id="newPassword" type="password" minlength="8" required autocomplete="new-password">
            <div class="hint">Не короче 8 символов и не совпадает с логином</div>
        </div>
        <div class="form-group">
            <label for="repeatPassword">Повторите новый пароль</label>
            <input id="repeatPassword" type="password" minlength="8" required autocomplete="new-password">
        </div>
        <button class="btn" type="submit">Сохранить и войти →</button>
    </form>

    <div class="notice">Никому не сообщайте пароль — даже учителю или администратору.</div>
</main>

<script src="/js/api.js"></script>
<script src="/js/change-password.js"></script>
</body>
</html>
